name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy locally
    # Runs on a self-hosted runner registered on the machine that actually hosts the local
    # docker-compose stack - GitHub's own hosted runners can't reach this machine's Docker
    # daemon or localhost, so a fully local deploy has to run on hardware you control.
    runs-on: [self-hosted, local-deploy]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build changed images
        run: docker compose build

      - name: Deploy (recreate containers whose image changed)
        run: docker compose up -d

      - name: Wait for every service to report healthy
        # PowerShell, not bash: this is a Windows self-hosted runner, and `shell: bash` isn't
        # reliably resolvable there - it depends on whatever happens to be first on PATH
        # (Git Bash, WSL's bash.exe shim, etc), which varies by machine setup. Windows
        # PowerShell (powershell.exe), not PowerShell Core (pwsh) - pwsh isn't installed here.
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $services = "apigateway","requestservice","employeeservice","departmentservice","leavebalanceservice","notificationservice","absenceservice"
          foreach ($s in $services) {
            Write-Host "Waiting on $s..."
            $healthy = $false
            for ($i = 1; $i -le 30; $i++) {
              $status = docker inspect --format='{{.State.Health.Status}}' "backend-$s-1" 2>$null
              if (-not $status) { $status = "starting" }
              if ($status -eq "healthy") {
                Write-Host "$s is healthy"
                $healthy = $true
                break
              }
              if ($i -eq 30) {
                Write-Host "::error::$s did not become healthy within 150s"
                docker compose logs $s --tail 50
                exit 1
              }
              Start-Sleep -Seconds 5
            }
          }

      - name: Post-deploy check
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri http://localhost:8080/health -UseBasicParsing | Out-Null
