# Local dev only: the default "guest" user can otherwise only authenticate
# from RabbitMQ's own loopback interface, which blocks every other container
# on the compose network (they are not "localhost" to RabbitMQ). This lifts
# that restriction so RequestService/NotificationService can connect as
# guest/guest (RabbitMQ's own default credentials - nothing changed here).
loopback_users.guest = false

# By default vm_memory_high_watermark is 0.4 of *total host* memory as RabbitMQ
# sees it - on a memory-constrained host that's already near its limit from
# everything else running, RabbitMQ trips its own memory alarm (blocking all
# connections) even though RabbitMQ itself is using barely any memory. Pin an
# absolute watermark sized for local dev instead of a relative one so this
# stays healthy regardless of host memory pressure.
vm_memory_high_watermark.absolute = 512MB
