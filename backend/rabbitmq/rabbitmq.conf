# Local dev only: the default "guest" user can otherwise only authenticate
# from RabbitMQ's own loopback interface, which blocks every other container
# on the compose network (they are not "localhost" to RabbitMQ). This lifts
# that restriction so RequestService/NotificationService can connect as
# guest/guest (RabbitMQ's own default credentials - nothing changed here).
loopback_users.guest = false
