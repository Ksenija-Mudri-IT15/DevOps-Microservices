version: '3.8'

services:
  # -------------------------
  # API GATEWAY
  # -------------------------
  apigateway:
    image: apigateway
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - microservices-net
    depends_on:
      requestservice:
        condition: service_healthy
      employeeservice:
        condition: service_healthy
      departmentservice:
        condition: service_healthy
      leavebalanceservice:
        condition: service_healthy
      notificationservice:
        condition: service_healthy
      absenceservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -------------------------
  # MICROSERVICES
  # -------------------------
  requestservice:
    image: requestservice
    build:
      context: ./RequestService
      dockerfile: Dockerfile
    networks:
      - microservices-net
    depends_on:
      request-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  employeeservice:
    image: employeeservice
    build:
      context: ./EmployeeService
      dockerfile: Dockerfile
    networks:
      - microservices-net
    depends_on:
      employee-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  departmentservice:
    image: departmentservice
    build:
      context: ./DepartmentService
      dockerfile: DepartmentService.API/Dockerfile
    networks:
      - microservices-net
    depends_on:
      department-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  leavebalanceservice:
    image: leavebalanceservice
    build:
      context: ./LeaveBalanceService
      dockerfile: Dockerfile
    networks:
      - microservices-net
    depends_on:
      leavebalance-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  notificationservice:
    image: notificationservice
    build:
      context: ./NotificationService
      dockerfile: Dockerfile
    networks:
      - microservices-net
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  absenceservice:
    image: absenceservice
    build:
      context: ./AbsenceService
      dockerfile: Dockerfile
    networks:
      - microservices-net
    depends_on:
      absence-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -------------------------
  # MESSAGE QUEUE
  # -------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI (guest/guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------
  # OBSERVABILITY: metrics (Prometheus + Grafana), traces (Jaeger), logs (Seq)
  # -------------------------
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090" # Prometheus UI / PromQL
    networks:
      - microservices-net

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000" # Dashboards (admin/admin, or open anonymously) - host 3000 is taken by a local Grafana service
    networks:
      - microservices-net
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC receiver (traces)
      - "4318:4318"   # OTLP HTTP receiver (traces)
    networks:
      - microservices-net

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    volumes:
      - seq_data:/data
    ports:
      - "5341:80" # Seq UI / log search
    networks:
      - microservices-net

  # -------------------------
  # POSTGRES DATABASES
  # -------------------------
  request-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: RequestDb
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d RequestDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  employee-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: EmployeeDb
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d EmployeeDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  department-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: DepartmentDb
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d DepartmentDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  leavebalance-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: LeaveBalanceDb
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d LeaveBalanceDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  notification-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: NotificationDb
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d NotificationDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  absence-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: AbsenceDb
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d AbsenceDb"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  microservices-net:
    driver: bridge

volumes:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  seq_data: